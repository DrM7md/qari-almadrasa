<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>أصوات تتلو القرآن | قارئ المدرسة</title>
  <meta name="description" content="استمع إلى تلاوات طلاب المدرسة المشاركين في مسابقة قارئ المدرسة وصوّت لأجمل الأصوات.">
  <meta name="theme-color" content="#052e23">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/cards.js" defer></script>
  <script src="/js/contestants.js" defer></script>
</head>
<body data-page="contestants">
<main>
  <section class="page-hero">
    <div class="pattern-layer"></div>
    <div class="container">
      <span class="eyebrow" style="color:var(--gold-hi)">المتسابقون</span>
      <h1>أصوات تتلو القرآن</h1>
      <p>استمع إلى تلاوات زملائك المعتمدة من لجنة المسابقة<span id="vote-hint"></span></p>
    </div>
  </section>
  <section class="container" style="margin-top:-46px;position:relative;z-index:3;padding-bottom:80px">
    <div id="vote-banner"></div>
    <div class="toolbar" role="search">
      <div class="search">
        <span data-icon="search"></span>
        <label class="sr-only" for="q">بحث</label>
        <input id="q" class="input" type="search" placeholder="ابحث باسم القارئ أو السورة أو رقم المشاركة" autocomplete="off">
      </div>
      <div><label class="sr-only" for="grade">الصف</label><select id="grade" class="input"><option value="">جميع الصفوف</option></select></div>
      <div><label class="sr-only" for="sort">الترتيب</label>
        <select id="sort" class="input">
          <option value="entry">الترتيب: رقم المشاركة (تصاعدي)</option>
          <option value="entry_desc">الترتيب: الأحدث مشاركةً</option>
          <option value="name">الترتيب: الاسم (أ–ي)</option>
        </select></div>
    </div>
    <p class="muted" id="count" aria-live="polite"></p>
    <div class="grid-cards" id="grid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </section>
</main>
</body>
</html>
