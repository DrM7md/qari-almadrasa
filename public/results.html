<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>إعلان الفائزين | قارئ المدرسة</title>
  <meta name="theme-color" content="#052e23">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/winners.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/results.js" defer></script>
</head>
<body data-page="results">
<main>
  <section class="win-hero" aria-labelledby="win-title">
    <div class="pattern-layer"></div>
    <canvas id="celebrate" aria-hidden="true"></canvas>
    <div class="win-rays" aria-hidden="true"></div>
    <div class="container center">
      <p class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
      <span class="eyebrow" style="color:var(--gold-hi)" id="comp-name">مسابقة قارئ المدرسة</span>
      <h1 id="win-title">إعلان الفائزين</h1>
      <p class="win-ayah">﴿ وَفِي ذَٰلِكَ فَلْيَتَنَافَسِ الْمُتَنَافِسُونَ ﴾ <small>المطففين: ٢٦</small></p>
      <p class="sub" id="res-sub">مبارك للفائزين، وبارك الله في جميع المشاركين؛ فكلّهم فائزون بشرف تلاوة كتاب الله.</p>
      <div class="hero-cta no-print" id="win-actions">
        <button class="btn" id="print-btn" type="button">طباعة النتائج / حفظها PDF</button>
        <a class="btn btn-ghost" href="/track#certificate">احصل على شهادتك</a>
      </div>
    </div>
  </section>
  <div class="print-head" aria-hidden="true"><img src="/img/logo.svg" alt="" width="60" height="60"><div><b id="print-title">نتائج مسابقة قارئ المدرسة</b><span id="print-date"></span></div></div>
  <section class="container win-body" id="res" aria-live="polite"></section>
</main>
</body>
</html>
