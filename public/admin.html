<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>لوحة الإدارة | قارئ المدرسة</title>
  <meta name="theme-color" content="#052e23">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/certificate.js" defer></script>
  <script src="/js/admin.js" defer></script>
</head>
<body class="admin" data-no-chrome>
  <div id="login-view" class="login-wrap hidden">
    <div class="pattern-layer"></div>
    <form class="login-card" id="login-form" novalidate>
      <img src="/img/logo.svg" alt="" width="70" height="70" style="margin:0 auto">
      <h1>لوحة الإدارة</h1>
      <p class="muted" style="margin:0">منصة «قارئ المدرسة»</p>
      <div class="field"><label for="lu">اسم المستخدم</label><input id="lu" class="input" dir="ltr" autocomplete="username" required></div>
      <div class="field"><label for="lp">كلمة المرور</label><input id="lp" type="password" class="input" dir="ltr" autocomplete="current-password" required></div>
      <div id="login-msg" class="mt-2"></div>
      <button class="btn btn-block mt-2" type="submit" id="login-btn">دخول</button>
      <a href="/" class="muted small" style="display:block;margin-top:16px">← العودة إلى الموقع</a>
    </form>
  </div>

  <div id="app" class="hidden">
    <div class="topbar-m"><b style="font-family:var(--f-display)">قارئ المدرسة — الإدارة</b><button class="btn btn-sm btn-ghost" id="side-toggle">القائمة</button></div>
    <div class="shell">
      <aside class="side" id="side">
        <div class="pattern-layer" style="opacity:.05"></div>
        <a class="brand" href="/" target="_blank" rel="noopener"><img src="/img/logo.svg" alt="" width="40" height="40"><span><b>قارئ المدرسة</b><small>لوحة الإدارة</small></span></a>
        <button class="tab" data-tab="dashboard" data-min="reviewer">لوحة الإحصائيات</button>
        <button class="tab" data-tab="entries" data-min="reviewer">إدارة المتسابقين <span class="count hidden" id="pending-count"></span></button>
        <button class="tab" data-tab="voting" data-min="admin">إدارة التصويت <span class="count hidden" id="attempt-count"></span></button>
        <button class="tab" data-tab="students" data-min="admin">الطلاب المؤهلون للتصويت</button>
        <button class="tab" data-tab="judging" data-min="reviewer">لجنة التحكيم</button>
        <button class="tab" data-tab="results" data-min="reviewer">النتائج والاعتماد</button>
        <button class="tab" data-tab="evals" data-only="judge">تقييماتي</button>
        <button class="tab" data-tab="settings" data-min="admin">الإعدادات العامة</button>
        <button class="tab" data-tab="admins" data-min="admin">المشرفون والمحكّمون</button>
        <button class="tab" data-tab="data" data-min="admin">الخصوصية وإدارة البيانات</button>
        <button class="tab" data-tab="audit" data-min="admin">سجل العمليات</button>
        <button class="tab" data-tab="account">حسابي</button>
        <div class="who"><b id="who-name"></b><span id="who-role"></span><br><button class="btn btn-sm btn-ghost mt-1" id="logout">تسجيل الخروج</button></div>
      </aside>
      <main class="main" id="main"></main>
    </div>
  </div>
</body>
</html>
